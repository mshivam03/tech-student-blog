name: Daily SEO Blog Publisher

on:
  workflow_dispatch: # Manually chalane ke liye
  schedule:
    - cron: '0 6 * * *' # Roz subah 6:00 AM UTC par automatic chalega

jobs:
  build:
    runs-on: ubuntu-latest

    # GitHub Actions ki Node.js deprecation warning ko bypass karne ke liye
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Libraries from Requirements
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Automation Script
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      run: |
        python automation.py
